<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#101412" id="theme-color-meta" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/svg+xml" href="/pwa.svg" />
    <title>MyFinances</title>
    <script>
      (function () {
        try {
          var raw = localStorage.getItem("myfinances:settings:v1");
          var theme = "system";
          var colorTheme = "sage";
          if (raw) {
            var parsed = JSON.parse(raw);
            if (parsed.theme) theme = parsed.theme;
            if (parsed.colorTheme) colorTheme = parsed.colorTheme;
          }
          var dark =
            theme === "dark" ||
            (theme === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) {
            document.documentElement.classList.add("dark");
            document.documentElement.style.colorScheme = "dark";
          }
          document.documentElement.classList.add("theme-" + colorTheme);
          var hexMap = {
            light: { sage: "#f5f8f5", rose: "#faf6f8", violet: "#f7f6fb", sky: "#f4f8fa", amber: "#faf8f3", graphite: "#f6f7f8", mint: "#f4f9f7", coral: "#faf6f4" },
            dark: { sage: "#101412", rose: "#151214", violet: "#131217", sky: "#101316", amber: "#151310", graphite: "#121314", mint: "#0f1513", coral: "#161211" }
          };
          var hex = (hexMap[dark ? "dark" : "light"] && hexMap[dark ? "dark" : "light"][colorTheme]) || (dark ? "#101412" : "#f5f8f5");
          var meta = document.getElementById("theme-color-meta") || document.querySelector('meta[name="theme-color"]');
          if (meta) { meta.setAttribute("content", hex); }
          var appleMeta = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]');
          if (appleMeta) { appleMeta.setAttribute("content", dark ? "black-translucent" : "default"); }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <div style="min-height: 100dvh; display: grid; place-items: center; padding: calc(env(safe-area-inset-top) + 24px) 24px calc(env(safe-area-inset-bottom) + 24px); font: 14px system-ui, sans-serif; opacity: 0.6;">
        Loading MyFinances...
      </div>
    </div>
    <script>
      function renderBootError(message) {
        var root = document.getElementById("root");
        if (!root) return;
        root.innerHTML =
          '<div style="min-height:100dvh;display:grid;place-items:center;background:#f7f7f4;color:#171717;padding:calc(env(safe-area-inset-top) + 24px) 24px calc(env(safe-area-inset-bottom) + 24px);font:14px system-ui,sans-serif;">' +
          '<section style="width:100%;max-width:520px;border:1px solid #deded8;background:#fffffd;border-radius:8px;padding:20px;box-shadow:0 14px 40px rgba(0,0,0,.08);">' +
          '<p style="margin:0 0 8px;color:#676761;font-size:12px;font-weight:700;text-transform:uppercase;">Boot error</p>' +
          '<h1 style="margin:0;font-size:24px;line-height:1.2;">Unable to load MyFinances</h1>' +
          '<p style="margin:12px 0 16px;color:#676761;line-height:1.6;">A critical startup error stopped the app before React could render.</p>' +
          '<pre style="white-space:pre-wrap;overflow:auto;max-height:180px;background:#eeecea;border-radius:8px;padding:12px;color:#676761;font-size:12px;">' +
          String(message || "unknown").replace(/[<>&]/g, function (char) {
            return { "<": "&lt;", ">": "&gt;", "&": "&amp;" }[char];
          }) +
          '</pre>' +
          '<button onclick="location.reload()" style="margin-top:16px;height:40px;border:0;border-radius:8px;background:#171717;color:#f7f7f4;padding:0 16px;font-weight:700;">Reload</button>' +
          '</section></div>';
      }
      window.addEventListener("error", function (event) {
        document.documentElement.dataset.bootError = event.message || "unknown";
        renderBootError(event.message);
      });
      window.addEventListener("unhandledrejection", function (event) {
        var message = event.reason && event.reason.message ? event.reason.message : "unknown";
        document.documentElement.dataset.bootError = message;
        renderBootError(message);
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
