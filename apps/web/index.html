<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f7f4" />
    <link rel="icon" type="image/svg+xml" href="/pwa.svg" />
    <title>MyFinances</title>
  </head>
  <body>
    <div id="root">
      <div style="min-height: 100vh; display: grid; place-items: center; color: #676761; font: 14px system-ui, sans-serif;">
        Loading MyFinances...
      </div>
    </div>
    <script>
      function renderBootError(message) {
        var root = document.getElementById("root");
        if (!root) return;
        root.innerHTML =
          '<div style="min-height:100vh;display:grid;place-items:center;background:#f7f7f4;color:#171717;padding:24px;font:14px system-ui,sans-serif;">' +
          '<section style="width:100%;max-width:520px;border:1px solid #deded8;background:#fffffd;border-radius:8px;padding:20px;box-shadow:0 14px 40px rgba(0,0,0,.08);">' +
          '<p style="margin:0 0 8px;color:#676761;font-size:12px;font-weight:700;text-transform:uppercase;">Boot error</p>' +
          '<h1 style="margin:0;font-size:24px;line-height:1.2;">Unable to load MyFinances</h1>' +
          '<p style="margin:12px 0 16px;color:#676761;line-height:1.6;">A critical startup error stopped the app before React could render.</p>' +
          '<pre style="white-space:pre-wrap;overflow:auto;max-height:180px;background:#eeecea;border-radius:8px;padding:12px;color:#676761;font-size:12px;">' +
          String(message || "unknown").replace(/[<>&]/g, function (char) {
            return { "<": "&lt;", ">": "&gt;", "&": "&amp;" }[char];
          }) +
          '</pre>' +
          '<button onclick="location.reload()" style="margin-top:16px;height:40px;border:0;border-radius:8px;background:#171717;color:#f7f7f4;padding:0 16px;font-weight:700;">Reload</button>' +
          '</section></div>';
      }
      window.addEventListener("error", function (event) {
        document.documentElement.dataset.bootError = event.message || "unknown";
        renderBootError(event.message);
      });
      window.addEventListener("unhandledrejection", function (event) {
        var message = event.reason && event.reason.message ? event.reason.message : "unknown";
        document.documentElement.dataset.bootError = message;
        renderBootError(message);
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
